<script>
function getCookie(cname) { var name = cname + "="; var ca = document.cookie.split(';'); for(var i=0; i<ca.length; i++) 
 {var c = ca[i]; while (c.charAt(0)==' ') c = c.substring(1); if (c.indexOf(name) != -1) return c.substring(name.length,c.length);} return ""; } 
function setCookie(cname, cvalue, exdays) { var d = new Date(); d.setTime(d.getTime() + (exdays*24*60*60*1000));
 var expires = "max-age=31536000"/*+d.toGMTString()*/; document.cookie = cname + "=" + cvalue + "; " + expires;}
function f_login(u)
{
	var v = 1;
	if($("#un").val() == '' && $("#pass").val() == '')
	{
		setCookie("username", "guest");
		setCookie("passwd", "guest");
		setCookie("loginok", "0");
		v = 0;
	}
	var a = document.getElementById("err");
	if(v == 1)
	{
		var logok = $.ajax({ type: "GET", url: "getAny.cgi?oper=log&u=" + $("#un").val() + "&p=" + $("#pass").val() + "&x=" + Math.random(), data: "", dataType:"text", async: false }).responseText;
		if(logok.indexOf("Login error") >= 0)
		{
			a.style.visibility = "visible";
			a.innerHTML = "<h1><font color=#ccaaaa>Login ERROR.</font></h1>";
		}
		else
		{
			setCookie("username", $("#un").val());
			setCookie("passwd", $("#pass").val());
			setCookie("loginok", "1");
		}
		document.location = 'home.html';
	}
	else
	{
		document.location = 'home.html';
	}
}
function inita()
{
	var l = getCookie("login");
	if(l == '1' || (getCookie("username") == "guest" && getCookie("passwd") == "guest"))
		document.location = 'home.html';
}
</script>
