function farun()

      }
      else
      {
         if(totale == 0)
            a.style.opacity = '1';
         else
            a.style.opacity = '0.5';

      a.innerHTML = '<CENTER><FONT class=b COLOR="#0000FF"><b>' + bf[j + 10 + (i - 1) * NN] + '</b></CENTER>';

   if(h >= 12)
   {
      h = h % 12;
      var c1 = "";

         c1 = "0";
      c1 = c1 + h + ":";
      if(m < 10)
         c1 += "0";
      o.value = c1 + m;
   }

      h += 12;

      w = '0';
   w += h + ':';

      w += '0';
   w += m;
   var j = 0;

function puntm()
{
   var ad = [ 'Sun', 'Mon','Thu','Wed','Thu','Fri','Sat','7' ];
   timpc1 = 0;
   var q1 = document.getElementById('timpc');
   var cd = new Date();
   var day = cd.getDate();
   var d1 = cd.getDay();
   var month = cd.getMonth() + 1;
   var year = cd.getFullYear();
   var ho = cd.getHours();
   var suffix = "AM";
   if (ho >= 12) { suffix = "PM";   ho -= 12; }
   if (ho == 0) ho = 12;
   var s2 =cd.getMinutes();
   var tm1 = ho + ':' + ((s2 > 9) ? s2 : '0' + s2) + ' ' + suffix;
   q1.innerHTML =  '<FONT COLOR=#FFFFFF size=+1> ' + ad[d1] + ', ' + month + '/' + day + '/' + year + ' ' +  tm1 + '</FONT>';
}
