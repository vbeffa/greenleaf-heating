function incre(i, inc)
{
	if(loginok != 1)

		alert("Guest access is limited");
		return true;
	}
	var k = 0;
	for(k = 0; k < num; k++)
	{
		if(/*k < num - 1 &&*/ Number(heat[N * k]) == i)
			break;
//		if(k == num - 1) 
//			break;
	}
	if(k < num)
	{
		var l = Number(heat[N * k + 2]); 
		if(winter == 0)
			l = Number(heat[N * k + 3]);
		l += inc; 
		var a = document.getElementById('px' + i + '1');
		if(a)
		if(l < 40)
			l = 40;
		if(l > 90)
			l = 90;
		heat[N * k + 2 + (1 - winter)] = "" + l;
/*
		a = document.getElementById('ix' + i + '0');
		if(Number(heat[N * k + 2]) > Number(heat[N * k + 1]) && winter == 1)
		{
			a.style.backgroundImage = 'url(images/thermostat_up.gif)';
		}
		if(Number(heat[N * k + 2]) <=Number(heat[N * k + 1]) && winter == 1)
		{
			a.style.backgroundImage = 'url(images/thermostat.gif)';
		}
		a = document.getElementById('ix' + i + '2');
		if(Number(heat[N * k + 3]) < Number(heat[N * k + 1]) && winter == 0)
		{
			a.style.backgroundImage = 'url(images/thermostat_dn.gif)';
			a.style.backgroundPosition = '0 25px';
		}
		if(Number(heat[N * k + 3]) >= Number(heat[N * k + 1]) && winter == 0)

			a.style.backgroundPosition = '0 25px';

*/

//		execut(i);
