<HTML>
<HEAD>
<TITLE>20917 Greenleaf</TITLE>
<style>
body, tr, td, input, select, p, div { font-family: Verdana; font-size: 13pt;};
</style>
<script>
var activa = 0;
var v_activa;
function initb()
{
	v_activa = document.getElementById("alfa");
	if(v_activa)
	{
		v_activa.style.background = "#cdcdcd";
		v_activa.style.cursor = "";
	}
}
function changeA(o, i)
{
	var a = [ "home.html", "heating.html", "cooling.html", "security.html", "irrigation.html", "setup.html", "contact.html", "docs.html" ];
	if(i != activa)
	{
		if(v_activa)
		{
			v_activa.style.background = "#efefef";
			v_activa.style.cursor = "pointer";
		}
		o.style.background = "#cdcdcd";
		o.style.cursor = "";
		activa = i;
		v_activa = o;
		document.getElementById("sc").src = a[activa];
	}
}
function contactul()
{
	changeA(document.getElementById("beta"), 6);
}
</script>
</HEAD>
<BODY BGCOLOR="#ffffff" onLoad=initb() leftmargin=0 topmargin=0>
<P><TABLE BORDER=0 CELLSPACING=0 CELLPADDING=0>
   <TR>
      <TD WIDTH=1130>
         <CENTER><TABLE BORDER=1 CELLSPACING=0 CELLPADDING=2 WIDTH="100%">
            <TR>
               <TD onClick='changeA(this, 0)' id=alfa style='cursor:pointer; background-color: #efefef;'><CENTER>HOME</CENTER></TD>
               <TD onClick='changeA(this, 1)' style='cursor:pointer; background-color: #efefef;'><CENTER>CLIMATE</CENTER></TD>
               <TD onClick='changeA(this, 3)' style='cursor:pointer; background-color: #efefef;'><CENTER>SECURITY</CENTER></TD>
               <TD onClick='changeA(this, 4)' style='cursor:pointer; background-color: #efefef;'><CENTER>IRRIGATION</CENTER></TD>
               <TD onClick='changeA(this, 5)' style='cursor:pointer; background-color: #efefef;'><CENTER>SETTINGS</CENTER></TD>
               <!--TD onClick='changeA(this, 6)' id=beta style='cursor:pointer; background-color: #efefef;'><CENTER>CONTACT</CENTER></TD-->
               <TD onClick='changeA(this, 7)' style='cursor:pointer; background-color: #efefef;'><CENTER>DOCS</CENTER></TD>
            </TR>
         </TABLE>
          </CENTER>
      </TD>
   </TR>
   <TR>
      <TD WIDTH=1130>
         <CENTER><IFRAME id=sc SRC="home.html" frameborder=0 width=1154 height=700></frame></CENTER>
      </TD>
   </TR>
</TABLE>
</P>
</BODY>
</HTML>
